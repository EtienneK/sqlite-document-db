name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Reused by the publish workflow, so a release runs the FULL matrix rather
  # than a copy of it that can drift.
  workflow_call:

# A newer push to the same branch makes the in-flight run redundant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keeps the downloaded mongod inside the workspace so it can be cached.
  MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

jobs:
  test:
    name: ${{ matrix.os }} / node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        # 24 is the floor declared in package.json's engines field. Node 22
        # had node:sqlite (from 22.13) and was supported for a while, but its
        # iterate() does not keep the statement alive across GC - a live
        # cursor's statement could be finalized out from under it (measured;
        # the statement cache made the exposure reliable) - and an exception
        # thrown from a db.function() callback inside an UPDATE was swallowed
        # into NULL. Both are fixed lines >= 24. The two entries are not
        # redundant: node:sqlite bundles its own SQLite, and its query planner
        # decides whether the expression indexes this library creates are
        # actually used. test/query-plan.spec.ts is the guard, and it needs to
        # run on every SQLite version users might have.
        node: ['24', '26']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # The mongod binary is ~100MB and the suite boots a real one; downloading
      # it on every job would dominate the run.
      - name: Cache the mongod binary
        uses: actions/cache@v4
        with:
          path: ${{ env.MONGOMS_DOWNLOAD_DIR }}
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: mongodb-binaries-${{ runner.os }}-

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      # Type-level assertions (BACKLOG item 5b). `typecheck` above already
      # validates the @ts-expect-error directives; this reports each case.
      - run: npm run test:types

      - run: npm run build

      # Every assertion runs twice: once against this library and once against
      # a real MongoDB booted in-process. See README, "Development".
      - run: npm test

      # Documentation that is not executed rots. dist/ was just built, so the
      # runner is invoked directly rather than through `npm run examples`.
      - name: Run the examples
        run: node examples/run-all.mjs

  # Deno implements node:sqlite, including the custom-function support $regex
  # needs, so the library works there unchanged. Nothing else in this repo
  # exercises that - the test suite is vitest-bound - which makes the examples
  # the natural Deno smoke test.
  deno:
    name: deno / examples
    runs-on: ubuntu-latest
    env:
      MONGOMS_DISABLE_POSTINSTALL: '1' # no mongod is started here
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - run: deno --version

      - name: Run every example under Deno
        run: deno run --allow-read --allow-write --allow-env examples/run-all.mjs

      - name: Run the TypeScript examples under Deno
        run: |
          deno run --allow-read --allow-write --allow-env examples/11-typed.ts
          deno run --allow-read --allow-write --allow-env examples/deno.ts

  bench:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    env:
      # The benchmarks measure this library alone - no mongod is ever started,
      # so don't spend a 100MB download fetching one during install.
      MONGOMS_DISABLE_POSTINSTALL: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm

      - run: npm ci

      # No thresholds - shared runners are far too noisy to assert timings on.
      # This only proves the benchmark suite still runs, which is a real check:
      # it exercises 20k-document collections and every indexed query shape.
      - run: npm run bench

      # The stress suite DOES assert, because everything it asserts is a
      # ceiling rather than a timing: it completed, the compiled SQL stayed
      # under N bytes, peak RSS stayed under N MB. It found a quadratic $slice
      # on its first run (BACKLOG item 34), so it earns its place here.
      - run: npm run stress
